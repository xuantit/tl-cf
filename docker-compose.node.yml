services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cftool
      MYSQL_USER: cftool
      MYSQL_PASSWORD: cftoolpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  node-backend:
    build: ./node-backend
    ports:
      - "9000:9000"
    environment:
      PORT: 9000
      DATABASE_URL: mysql://cftool:cftoolpass@mysql:3306/cftool
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-16-chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./node-backend:/app
      - /app/node_modules

volumes:
  mysql_data:
