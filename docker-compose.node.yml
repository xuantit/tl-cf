services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cftool
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cftool"]
      interval: 10s
      timeout: 5s
      retries: 5

  node-backend:
    build: ./node-backend
    ports:
      - "9000:9000"
    environment:
      PORT: 9000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cftool
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-16-chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./node-backend:/app
      - /app/node_modules

volumes:
  postgres_data:
